# Patch overlay that adds the Claude Code CLI as a provider route and makes it
# the default model for agents this profile creates.
#
#   dsh --profile headless --patch /absolute/path/to/dsh-claude-cli/cordis.yml "your task"
#
# Plugin paths in a patch must be absolute: a patch contributes configuration
# without changing the directory the loader resolves module paths from. Replace
# the path below with this file's own directory.

- insert:
    - id: claude-cli
      name: '/absolute/path/to/dsh-claude-cli/src/index.ts'
      config:
        providers:
          - anthropic-claude-cli
        # Agent presets commonly set maxTokens for every route they might run
        # on, and the CLI has no flag for it. Drop those fields rather than
        # failing the request.
        unsupportedFields: ignore

- id: agent-default-model
  config:
    provider: anthropic-claude-cli
    model: sonnet
